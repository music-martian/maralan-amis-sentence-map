<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="馬蘭阿美語句型圖 — Klokah 全庫（國中／高中句型、生活會話、情境族語、族語短文）即時 SVG 學習／練習" />
  <title>馬蘭阿美語 · 句型圖</title>
  <link rel="stylesheet" href="styles.css?v=20260917n" />
</head>
<body class="mode-learn">
  <div class="app">
    <header class="site-header">
      <h1>馬蘭阿美語 · 句型圖</h1>
      <p class="subtitle" id="unit-subtitle">選擇單元開始學習</p>
      <a
        class="klokah-link"
        id="klokah-link"
        href="https://klokah.iformosa.com.tw/"
        target="_blank"
        rel="noopener noreferrer"
      >Klokah 原文教材 ↗</a>
    </header>

    <div class="unit-pickers" role="group" aria-label="選擇教材單元">
      <label class="picker">
        <span class="picker-label">模組</span>
        <select id="sel-module" aria-label="模組"></select>
      </label>
      <label class="picker">
        <span class="picker-label">類型</span>
        <select id="sel-type" aria-label="類型／分類"></select>
      </label>
      <label class="picker picker-wide">
        <span class="picker-label">單元</span>
        <select id="sel-unit" aria-label="單元／課"></select>
      </label>
    </div>

    <div class="toolbar">
      <div class="mode-toggle" role="group" aria-label="學習模式">
        <button type="button" id="mode-learn" aria-pressed="true">學習 Learn</button>
        <button type="button" id="mode-practice" aria-pressed="false">練習 Practice</button>
      </div>

      <div class="nav">
        <button type="button" id="btn-prev" aria-label="上一句">‹ 上一句</button>
        <div class="dots" id="dots" aria-label="句子導覽"></div>
        <button type="button" id="btn-next" aria-label="下一句">下一句 ›</button>
      </div>

      <label class="visually-hidden" for="sentence-select">選擇句子</label>
      <select id="sentence-select" class="sentence-select" aria-label="選擇句子"></select>
    </div>

    <main class="card">
      <div class="sentence-meta">
        <div class="num" id="meta-num"></div>
        <div class="amis-row">
          <p class="amis" id="meta-amis"></p>
          <button type="button" class="audio-btn" id="btn-audio" aria-label="播放句子音訊" title="播放音訊">
            <span class="audio-icon" aria-hidden="true">🔊</span>
            <span class="audio-label">播放</span>
          </button>
        </div>
        <p class="zh" id="meta-zh"></p>
        <p class="en" id="meta-en"></p>
        <p class="audio-note" id="audio-note" hidden></p>
      </div>
      <audio id="sentence-audio" preload="none"></audio>

      <p class="practice-hint" id="practice-hint" hidden>點彩珠看阿美語</p>

      <div class="diagram-wrap" id="diagram" aria-live="polite"></div>
      <p class="load-status" id="load-status" hidden></p>

      <div class="color-legend" id="color-legend" aria-label="顏色圖例">
        <span><i class="swatch" style="background:#C9A6E8"></i>謂語 pred</span>
        <span><i class="swatch" style="background:#E8B4C4"></i>代詞 pronoun</span>
        <span><i class="swatch" style="background:#B7D9B8"></i>名詞 noun</span>
        <span><i class="swatch" style="background:#5B8DEF"></i>格標記 ko/no</span>
        <span><i class="swatch" style="background:#E8C84A"></i>助詞/副詞</span>
        <span><i class="swatch" style="background:#E88888"></i>第二子句謂語</span>
      </div>

      <div class="practice-bar" id="practice-bar" hidden>
        <div class="progress" id="progress">已顯示 0 / 0</div>
        <div class="practice-actions">
          <button type="button" id="btn-reveal-all">全部顯示</button>
          <button type="button" id="btn-next-q">下一題</button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p id="footer-unit">Klokah · 馬蘭阿美語 · 句型圖</p>
      <p>自動標記句型圖 — 簡化供學習用，結構可能需再調整</p>
      <p class="footer-note" hidden>GitHub Pages 會依單元動態載入 JSON；若以 file:// 開啟請用本機小伺服器，或先看內建問候單元。</p>
      <p class="footer-note" id="build-stamp">build 20260917n · center short · tight glottal</p>
    </footer>
  </div>

  <script src="catalog.js?v=20260917n"></script>
  <script src="data.js?v=20260917n"></script>
  <script src="diagram.js?v=20260917n"></script>
  <script src="app.js?v=20260917n"></script>
</body>
</html>
